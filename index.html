<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SSAT Climb</title>
<meta name="description" content="Offline SSAT Upper Level verbal trainer: synonyms, analogies, and your own word list.">
<meta name="theme-color" content="#1d2329">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Climb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#f4f1ea; --panel:#fffdf8; --ink:#1d2329; --muted:#66707a; --line:#e2ddd2;
  --accent:#e2602a; --accent-ink:#fff; --ok:#2f7d4f; --ok-bg:#e3f2e8; --no:#b93a32; --no-bg:#f8e3e1;
  --chip:#efeae0; --shadow:0 1px 2px rgba(29,35,41,.06),0 4px 14px rgba(29,35,41,.06);
  --r:16px; --safe-b:env(safe-area-inset-bottom); --safe-t:env(safe-area-inset-top);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14181c; --panel:#1d2329; --ink:#eef0f2; --muted:#9aa4ad; --line:#2c343c;
  --accent:#f0743d; --ok:#5cc489; --ok-bg:#16301f; --no:#f07a70; --no-bg:#3a1c1a; --chip:#252c33; --shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
#main{max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 14px) 16px calc(96px + var(--safe-b))}
h1{font-size:28px;line-height:1.15;margin:4px 0 10px;letter-spacing:-.02em}
h2{font-size:22px;margin:6px 0 12px;letter-spacing:-.01em}
.kicker{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)} .pad{padding:16px}
.hero{padding:10px 2px 16px}
.alt{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.alt .m{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.alt .at{color:var(--muted);font-size:14px}
.bar,.prog,.mini{height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar{margin:8px 0}.bar i,.prog i,.mini i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.sub{font-size:14px;color:var(--muted)}
.card{display:block;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:0 0 10px;box-shadow:var(--shadow)}
.card.row b,.card.tile b{display:block}.card.row span,.card.tile span{font-size:14px;color:var(--muted)}
.card.warn{border-color:var(--no)}
.card.tip{background:var(--chip);font-size:14px}
.card.note{font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.grid2 .card{margin:0;min-height:76px}
.cta{display:block;width:100%;background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:16px 18px;font-weight:700;font-size:18px;margin:6px 0 12px;text-align:center}
.cta small{display:block;font-weight:500;font-size:13px;opacity:.85}
.cta:active,.ch:active,.chips button:active,.tri button:active{transform:scale(.98)}
.ghost{padding:10px 12px;border-radius:12px;background:var(--chip);font-weight:600}
.ghost.wide{display:block;width:100%;text-align:center;margin:8px 0}
.danger{color:var(--no)}
.link{color:var(--accent);font-weight:600;padding:6px 0}
.topline{display:flex;justify-content:space-between;align-items:center}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:14px}.shead .prog{flex:1}.shead span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.shead .ghost{padding:6px 11px}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.stem{font-size:19px;font-weight:600;margin-top:6px}.stem.big{font-size:28px;font-weight:800;letter-spacing:.01em}
.choices{display:grid;gap:8px}
.ch{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:14px;background:var(--panel);border:1.5px solid var(--line);font-size:17px;min-height:52px}
.ch span{flex:none;width:28px;height:28px;border-radius:8px;background:var(--chip);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--muted)}
.ch.right{border-color:var(--ok);background:var(--ok-bg)}.ch.right span{background:var(--ok);color:#fff}
.ch.wrong{border-color:var(--no);background:var(--no-bg)}.ch.wrong span{background:var(--no);color:#fff}
.ch:disabled{opacity:1}
.fb{margin:14px 2px 8px;font-weight:700;font-size:17px}.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.info{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:8px 0 6px}
.info p{margin:4px 0}.info .ex{font-style:italic;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:4px}.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.no{background:var(--no-bg);color:var(--no)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips button{padding:11px 12px;border-radius:14px;background:var(--panel);border:1.5px solid var(--line);min-height:58px}
.chips b{display:block;font-size:15px}.chips small{color:var(--muted);font-size:12.5px}
.tri{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tri button{padding:18px 8px;border-radius:14px;background:var(--panel);border:1.5px solid var(--line);font-weight:700;text-align:center}
.tri button:nth-child(1){color:var(--ok)}.tri button:nth-child(3){color:var(--no)}
.done{text-align:center;padding-top:30px}.done h1{font-size:56px;margin:6px 0}.done p{color:var(--muted)}
.brow b{display:block}.brow span{display:block}.brow small{color:var(--muted)}
.brow.hot{border-left:4px solid var(--accent)}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.seg button{flex:none;padding:7px 13px;border-radius:99px;background:var(--chip);font-size:14px;font-weight:600}
.seg button.on{background:var(--ink);color:var(--bg)}
.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.wrow{display:flex;align-items:center;gap:8px;width:100%;padding:13px 14px;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:0}.wrow b{font-weight:600}
.wrow em.b{font-style:normal;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--chip);color:var(--muted)}.wrow em.b.no{background:var(--no-bg);color:var(--no)}
.dots{margin-left:auto;display:flex;gap:3px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--chip)}.dots i.f{background:var(--ok)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stats3 div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 10px}
.stats3 b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.stats3 span{font-size:12px;color:var(--muted)}
.brrow{display:grid;grid-template-columns:120px 1fr 44px;align-items:center;gap:10px;margin-top:10px;font-size:14px}.brrow small{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.parent summary{font-weight:700;cursor:pointer}
p.ok{color:var(--ok);font-weight:600}p.no{color:var(--no);font-weight:600}
.rateq{margin:14px 2px 8px;font-weight:600}
.rate{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rate button{padding:14px 10px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel);font-weight:700;text-align:center;font-size:16px}
.rate .r-dont{color:var(--no)}.rate .r-know{color:var(--ok)}.rate .r-guess{color:#b7791f}.rate .r-unsure{color:var(--muted)}
.rate button.on{color:#fff;border-color:transparent}.rate .r-dont.on{background:var(--no)}.rate .r-know.on{background:var(--ok)}.rate .r-guess.on{background:#b7791f}.rate .r-unsure.on{background:var(--muted)}
.explain{display:block;margin:10px auto 0;text-align:center;font-size:16px}
.shead .back{padding:6px 10px;font-size:15px}.shead .back:disabled{opacity:.35}
.trapmsg{background:var(--no-bg);color:var(--ink);border-radius:12px;padding:10px 12px;margin:6px 0;font-size:15px}
.qbtn{width:34px;height:34px;border-radius:50%;background:var(--chip);font-weight:800;text-align:center;font-size:17px;color:var(--ink)}
.help h2{margin-top:14px}.help p{font-size:17px;line-height:1.5}
.hdots{display:flex;gap:6px;justify-content:center;margin:18px 0 6px}.hdots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.hdots i.on{background:var(--accent);width:18px;border-radius:99px}
.hnav{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}.hnav .cta{margin:6px 0}.hnav .ghost{padding:16px 18px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--safe-b));z-index:5}
.nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--accent)}
.nav button.add{color:var(--accent)}
.nav button.add svg{width:34px;height:34px;padding:5px;margin-top:-4px;border-radius:12px;background:var(--accent);color:#fff}
#sheet{position:fixed;inset:0;background:rgba(10,12,14,.45);display:none;align-items:flex-end;z-index:10}
#sheet.on{display:flex}
.sheet-in{width:100%;max-width:560px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;padding:16px 16px calc(24px + var(--safe-b));max-height:88vh;overflow:auto}
#addform{display:flex;gap:8px}#addform input{flex:1;min-width:0;font-size:19px;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink)}
#addform .cta{width:auto;margin:0;padding:0 20px}
#toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:20}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<main id="main"></main>
<nav class="nav">
  <button data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 20l6.5-11 3.5 6 2.5-4L21 20z"/></svg>Climb</button>
  <button data-go="syn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h16M4 15h16"/></svg>Synonyms</button>
  <button class="add" data-act="addopen" aria-label="Add a word"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>Word</button>
  <button data-go="ana"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="12" r="2.5"/><path d="M8.5 12h7"/></svg>Analogies</button>
  <button data-go="words"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h6"/></svg>Words</button>
  <button data-go="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-5"/></svg>Progress</button>
</nav>
<div id="sheet"></div>
<div id="toast"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
